<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Activity Tracker Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>Activity Tracker</h2>
    
    <div class="status-panel" id="statusPanel">
      <div class="status-indicator" id="statusIndicator"></div>
      <span id="statusText">Checking connection...</span>
    </div>

    <form id="settingsForm">
      <div class="form-group">
        <label for="collectorUrl">Collector URL</label>
        <input type="url" id="collectorUrl" required>
        <div class="hint">The endpoint where activity events will be sent (e.g., http://127.0.0.1:8765)</div>
      </div>

      <div class="form-group">
        <label for="minDuration">Minimum Duration (seconds)</label>
        <input type="number" id="minDuration" min="0" step="0.5" required>
        <div class="hint">Sessions shorter than this will be discarded to prevent noise.</div>
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="trackInternal">
          Track internal pages (chrome://, about:, etc.)
        </label>
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="stripParams">
          Strip URL query parameters
        </label>
        <div class="hint">Removes ?query=string from URLs before sending for privacy.</div>
      </div>

      <div class="actions">
        <button type="submit" class="btn primary">Save Settings</button>
        <button type="button" class="btn secondary" id="testBtn">Test Connection</button>
      </div>
      
      <div id="saveMessage" class="message hidden">Settings saved successfully!</div>
    </form>
  </div>
  
  <script src="config.js"></script>
</body>
</html>
